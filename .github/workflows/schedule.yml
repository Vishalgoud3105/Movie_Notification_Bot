name: Watch BMS showtimes

on:
  schedule:
    # Every 10 min. GitHub's own cron drifts 5-20 min under load, so this is
    # really "within ~30 min of opening". The script adds 0-45s jitter so runs
    # don't land on the exact tick; a sane rate is the single biggest thing
    # keeping this from looking like a scraper.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# One run at a time, otherwise two runs race on the seen.json cache.
concurrency:
  group: bms-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Carries seen.json between runs so you get notified once, not every 20 min.
      - uses: actions/cache@v4
        with:
          path: seen.json
          key: bms-seen-${{ github.run_id }}
          restore-keys: bms-seen-

      - env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_CODE: ET00502630
          REGION_CODE: HYD
          DATES: '20260808,20260809'
          TIME_FROM: '06:00'
          TIME_TO: '20:00'
          FORMAT: '4DX 3D'
          LANGUAGE: English
        # Manual run ("Run workflow" button) = --test, which always sends a
        # message so you can confirm delivery. Every scheduled run is the real
        # watcher: silent until 8-9 Aug open, then one real alert.
        run: python bms_watch.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
