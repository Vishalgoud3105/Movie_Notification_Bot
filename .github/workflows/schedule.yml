name: Watch BMS showtimes

on:
  # SCHEDULE DISABLED - BookMyShow returns 403 to GitHub's runners.
  #
  # Verified 2026-08-01: both endpoints, all retries, instant 403 from Actions,
  # while the identical request returns 200 from a home connection. Actions runs
  # on Azure datacenter IPs and BMS treats datacenter traffic differently. This
  # is a network-level block; no header or endpoint change gets around it.
  #
  # The watcher runs locally instead - see run_watcher.bat and Task Scheduler.
  # Re-enable by uncommenting if BMS ever starts answering the runners.
  #
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

# One run at a time, otherwise two runs race on the seen.json cache.
concurrency:
  group: bms-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Carries seen.json between runs so you get notified once, not every 20 min.
      - uses: actions/cache@v4
        with:
          path: seen.json
          key: bms-seen-${{ github.run_id }}
          restore-keys: bms-seen-

      - env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_CODE: ET00502630
          REGION_CODE: HYD
          DATES: '20260808,20260809'
          TIME_FROM: '06:00'
          TIME_TO: '20:00'
          FORMAT: '4DX 3D'
          LANGUAGE: English
        # Manual run ("Run workflow" button) = --test, which always sends a
        # message so you can confirm delivery. Every scheduled run is the real
        # watcher: silent until 8-9 Aug open, then one real alert.
        run: python bms_watch.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
